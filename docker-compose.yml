name: carvan

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: carvan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_password}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carvan-net

  redis:
    image: redis:7.4-alpine
    container_name: carvan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carvan-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: carvan-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env
    ports:
      - "9000:9000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - /app/.medusa
    networks:
      - carvan-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: carvan-client
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - ./client/.env.local
    ports:
      - "8000:8000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - carvan-net

volumes:
  postgres_data:
    name: carvan-postgres-data
  redis_data:
    name: carvan-redis-data

networks:
  carvan-net:
    name: carvan-net
    driver: bridge
